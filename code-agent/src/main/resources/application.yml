server:
  port: 8081

spring:
  application:
    name: code-agent
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: code-agent-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: com.hyeokjin.devflow.codeagent.event
        spring.json.value.default.type: com.hyeokjin.devflow.codeagent.event.DevTaskCreatedEvent
        spring.json.use.type.headers: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

devflow:
  kafka:
    topics:
      dev-task-created: dev-task-created
